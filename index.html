<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScanSnap - ドキュメントスキャナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M7 8h10M7 12h10M7 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>ScanSnap</span>
      </div>
      <button class="btn-pdf" id="exportBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2"/>
          <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="18" x2="12" y2="12" stroke="currentColor" stroke-width="2"/>
          <polyline points="9,15 12,18 15,15" stroke="currentColor" stroke-width="2"/>
        </svg>
        PDF出力 (<span id="pageCount">0</span>)
      </button>
    </div>
  </header>

  <!-- メイン -->
  <main class="main">

    <!-- カメラビュー -->
    <div class="camera-section" id="cameraSection">
      <div class="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay" class="overlay"></canvas>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>
      </div>
      <div class="camera-controls">
        <button class="btn-icon" id="galleryPickBtn" title="ギャラリーから選択">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
            <polyline points="21,15 16,10 5,21" stroke="currentColor" stroke-width="2"/>
          </svg>
          <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
        </button>
        <button class="btn-capture" id="captureBtn">
          <div class="capture-ring"></div>
        </button>
        <button class="btn-icon" id="switchCamera" title="カメラ切替">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M20 7h-9m0 0a3 3 0 0 0-3-3H5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-9a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <div class="camera-tip">書類を枠内に合わせて撮影してください</div>
    </div>

    <!-- 画像編集ビュー -->
    <div class="edit-section hidden" id="editSection">
      <div class="edit-header">
        <button class="btn-text" id="cancelEdit">キャンセル</button>
        <span>画像を調整</span>
        <button class="btn-text accent" id="confirmEdit">追加</button>
      </div>
      <div class="edit-canvas-wrap">
        <canvas id="editCanvas"></canvas>
      </div>
      <div class="edit-tools">
        <div class="tool-group">
          <label>明るさ</label>
          <div class="slider-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="range" id="brightness" min="-100" max="100" value="0" class="slider">
            <span id="brightnessVal">0</span>
          </div>
        </div>
        <div class="tool-group">
          <label>コントラスト</label>
          <div class="slider-row">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 2v20M12 2a10 10 0 0 1 0 20" fill="currentColor"/></svg>
            <input type="range" id="contrast" min="-100" max="100" value="0" class="slider">
            <span id="contrastVal">0</span>
          </div>
        </div>
        <div class="tool-group">
          <label>フィルター</label>
          <div class="filter-row">
            <button class="filter-btn active" data-filter="none">
              <div class="filter-preview original"></div>
              <span>オリジナル</span>
            </button>
            <button class="filter-btn" data-filter="mono">
              <div class="filter-preview mono"></div>
              <span>モノクロ</span>
            </button>
            <button class="filter-btn" data-filter="doc">
              <div class="filter-preview doc"></div>
              <span>書類</span>
            </button>
            <button class="filter-btn" data-filter="vivid">
              <div class="filter-preview vivid"></div>
              <span>鮮明</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- スキャン済みページ一覧 -->
    <div class="pages-section" id="pagesSection">
      <div class="pages-header">
        <span class="pages-title" id="pagesTitle">スキャン済みページ</span>
        <button class="btn-text-sm" id="clearAllBtn" style="display:none">すべて削除</button>
      </div>
      <div class="pages-grid" id="pagesGrid">
        <div class="empty-state" id="emptyState">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" opacity="0.3">
            <rect x="4" y="2" width="12" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 7h4M8 10h4M8 13h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="17" cy="17" r="5" fill="white" stroke="currentColor" stroke-width="1.5"/>
            <path d="M17 14v3l2 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <p>カメラボタンを押して<br>書類をスキャンしましょう</p>
        </div>
      </div>
    </div>

  </main>

  <!-- ページプレビューモーダル -->
  <div class="modal hidden" id="previewModal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <span id="previewTitle">ページ 1</span>
        <button class="btn-icon-sm" id="closeModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <img id="previewImg" src="" alt="">
      <div class="modal-actions">
        <button class="btn-danger" id="deletePageBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="3,6 5,6 21,6" stroke="currentColor" stroke-width="2"/><path d="M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2"/></svg>
          削除
        </button>
        <button class="btn-primary" id="downloadPageBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"/><polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2"/></svg>
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- PDF生成中オーバーレイ -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>PDF生成中...</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
